# Simple Project Configuration
# For small projects with basic commit conventions
# Copy to: .claude/config/git/commit/main.yaml

plugin_version: "1.0.21"

project: your-project-name
description: "Small project with simple structure"

# Format specification
format:
  pattern: "{type}({scope}): {subject}"
  max_subject_length: 72
  max_body_line_length: 100

# Quick reference - standard types
types_quick:
  feat: "New feature or capability"
  fix: "Bug fix"
  refactor: "Code change (neither bug fix nor feature)"
  docs: "Documentation only"
  chore: "Maintenance, tooling, dependencies"

# Simple scopes for small projects
# String format: scope: "description"
# Object format (with default_type):
#   scope:
#     description: "Description"
#     default_type: "chore"  # Skip type deliberation for this scope
scopes_quick:
  app: "Application code"
  config: "Configuration files"
  docs: "Documentation"

# Which diffs are worth reading
#
# never_read:  glob patterns whose diffs carry no semantic value. The skill sees
#              them in the stat and commits them, but never loads their content.
# commit_with: derived file -> the source file it must ride along with. If the
#              derived file changed but its source did NOT, the skill surfaces it
#              instead of skipping (e.g. a lock file bumped by `npm audit fix` IS
#              the change, and its diff must be read).
#
# Patterns are unioned with any `-diff` / `linguist-generated=true` entries in
# .gitattributes. Omit this section entirely to fall back to the skill's built-in
# defaults (common lock files only).
#
# Only TRACKED files matter — `git diff` never reports gitignored, untracked
# files, so there is no need to list build output you already gitignore.
# A pattern with no `/` matches at any depth; `**/` spans directories.
diff_policy:
  never_read:
    - "**/*.lock"
    - "package-lock.json"
  commit_with:
    "package-lock.json": "package.json"
    "yarn.lock": "package.json"
    "pnpm-lock.yaml": "package.json"

# Footer conventions
footer:
  required: []
  optional:
    - "BREAKING CHANGE: description"
    # "Closes #123" when the commit finishes the issue; "Refs #123" only when it does not.
    - "Closes #123 or Refs #123"

# Type Decision Tree
type_decision_tree:
  - question: "What are you doing?"
    answers:
      adding_new_capability: "feat"
      fixing_bug: "fix"
      changing_code_structure: "refactor"
      updating_docs_only: "docs"
      updating_dependencies: "chore"

# Scope Decision
scope_decision:
  - question: "What files changed?"
    app_code: "app"
    config_files: "config"
    documentation: "docs"

# Subject line conventions
subject_conventions:
  - "Use imperative mood: 'Add feature' not 'Added feature'"
  - "Capitalize first letter"
  - "No period at end"
  - "Be specific"
