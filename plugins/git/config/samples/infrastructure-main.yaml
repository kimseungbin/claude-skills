# Infrastructure Project Configuration
# For CDK, Terraform, Pulumi, and other IaC projects
# Copy to: .claude/config/git/commit/main.yaml

plugin_version: "1.0.26"

project: your-infrastructure-project
description: "Infrastructure as Code project"
implementation: infrastructure  # Loads guides/infrastructure.md

# Format specification
format:
  pattern: "{type}({scope}): {subject}"
  max_subject_length: 72
  max_body_line_length: 100

# Quick reference - IaC-focused types
# For detailed decision trees, see types/ directory
types_quick:
  feat: "New infrastructure capability (Lambda, CDK constructs)"
  fix: "Bug fix in infrastructure code"
  refactor: "Code restructuring without behavior change"
  docs: "Documentation only"
  chore: "Config/workflow changes without new code"

# Infrastructure scopes - update for your project
# For detailed patterns, see scopes/ directory
scopes_quick:
  service:
    description: "Core service construct (ECS, Lambda)"
    patterns:
      - "lib/**/service*.ts"
      - "lib/**/lambda*.ts"
  cloudfront:
    description: "CDN/caching construct"
    patterns:
      - "lib/**/cloudfront*.ts"
      - "lib/**/cdn*.ts"
  database:
    description: "Database constructs (RDS, DynamoDB)"
    patterns:
      - "lib/**/database*.ts"
      - "lib/**/rds*.ts"
      - "lib/**/dynamodb*.ts"
  config:
    description: "Configuration files"
    patterns:
      - "cdk.json"
      - "*.config.ts"
      - "config/**"
  deployment:
    description: "CI/CD and deployment pipelines"
    default_type: "chore"
    patterns:
      - ".github/workflows/**"
      - "scripts/deploy*"
  tools:
    description: "Developer tooling"
    default_type: "chore"
    patterns:
      - "scripts/**"
      - "*.config.js"
  project:
    description: "Project documentation"
    default_type: "docs"
    patterns:
      - "README*.md"
      - "CLAUDE.md"
      - ".claude/**"

# Which diffs are worth reading
#
# never_read:  glob patterns whose diffs carry no semantic value. The skill sees
#              them in the stat and commits them, but never loads their content.
# commit_with: derived file -> the source it must ride along with. If the derived
#              file changed but its source did NOT, the skill surfaces it rather
#              than skipping — the derived file IS the change in that case.
#
# Unioned with `-diff` / `linguist-generated=true` entries in .gitattributes.
# Only TRACKED files matter: gitignored, untracked output never reaches git diff.
#
# For CDK/Terraform the big win is synthesized templates. `cdk.out/` is normally
# gitignored (no entry needed), but committed snapshot tests are not — a single
# CDK snapshot update can be tens of thousands of lines of pure noise.
diff_policy:
  never_read:
    - "**/*.lock"
    - "**/.terraform.lock.hcl"
    - "**/__snapshots__/**"
    - "**/*.snapshot.json"
    # Only if this repo commits synthesized output; a no-op when gitignored.
    - "**/cdk.out/**"
  commit_with:
    "package-lock.json": "package.json"
    "yarn.lock": "package.json"

# Footer conventions - includes deployment safety
footer:
  required: []
  optional:
    - "BREAKING CHANGE: description"
    # "Closes #123" when the commit finishes the issue; "Refs #123" only when it does not.
    - "Closes #123 or Refs #123"
  deployment_safety:
    note: "Required when pre-push hook detects resource replacement"
    fields:
      - "Safe-To-Deploy: manual-deletion-planned"
      - "Analyzed-By: <your-name>"
      - "Services: <service-list>"
    reference: "hooks/pre-push.md"

# Breaking-change detection (commit skill step 5e)
#
# The skill reads the group's diff and decides semantically whether the change
# breaks a consumer. `hints` describe what counts as breaking in THIS project so
# the skill knows where to look — they are attention hints, NOT regexes matched
# against the diff. "removed.*construct" as a regex fires on a comment mentioning
# a removed construct; reading the diff tells you whether one actually went away.
#
# For IaC the consumer is the deployed environment and the operator, not a
# downstream import. The breaking cases are the ones that cannot be resolved by
# `cdk deploy` alone: a resource that must be replaced, state that must be
# imported, a parameter that must exist before the stack runs.
#
# This overlaps footer.deployment_safety above, which the pre-push hook drives
# from a synthesized diff. The two are complementary: detection here marks the
# commit for version bumping at commit time; deployment_safety gates the push.
breaking_changes:
  detect: true

  # marker: both | footer | bang — see the samples README. "both" is the only
  # setting every conventional-commits version bumper recognizes.
  marker: both

  hints:
    - "A change forces resource replacement (logical ID renamed, immutable property changed)"
    - "A stack, construct, or exported CloudFormation output was removed or renamed"
    - "Deployment requires a manual step first — an SSM parameter, secret, or DNS record that must already exist"
    - "State must be imported or migrated by hand for the deploy to succeed"
    - "A construct's public props interface dropped or renamed a property"
    - "An IAM policy narrowed in a way that revokes access a consumer relies on"

  # Paths with no deployed surface. Detection skips a group entirely when every
  # one of its files matches here. Snapshots are excluded because a snapshot diff
  # is the *symptom* — the template change in lib/ is what gets judged.
  exempt_paths:
    - "**/*.test.ts"
    - "**/__snapshots__/**"
    - "**/cdk.out/**"
    - "docs/**"

# Type Decision Tree - Infrastructure focus
type_decision_tree:
  - question: "What are you doing?"
    answers:
      adding_new_capability: "feat"
      fixing_bug: "fix"
      changing_code_structure: "refactor"
      updating_docs_only: "docs"
      updating_dependencies: "chore"

  - question: "Infrastructure - does it involve production code?"
    yes_serves_applications:
      description: "New code that apps depend on"
      examples: ["New microservice", "Redis cluster", "CloudFront"]
      type: "feat({construct-scope})"
    yes_serves_operations:
      description: "Operational code (Lambda + CDK)"
      examples: ["Drift detection", "Cost alerts", "Automation"]
      type: "feat({construct-scope})"
    no_config_only:
      description: "Config/workflow without new Lambda/CDK"
      examples: ["Pipeline notifications", "GitHub Actions", "Flags"]
      type: "chore({scope})"

  - question: "Scope for infrastructure code?"
    new_construct: "Use construct name (e.g., drift-detection)"
    existing_construct: "Use construct name (e.g., service)"
    multiple_constructs: "Use 'infra' for broad changes"
    ci_cd_only: "Use 'deployment'"
    tooling_only: "Use 'tools'"

# Scope Decision
scope_decision:
  - question: "What files changed?"
    single_construct: "Use construct name"
    single_service: "Use service name"
    multiple_services: "Use parent scope (main, infra)"
    config_only: "Use config"
    docs_only: "Use project"

  - question: "Still unclear?"
    patterns: "See scopes/infrastructure.yaml"

# When to load detailed files
load_detailed_files:
  - condition: "Type unclear (feat vs chore for infra)"
    action: "See types/chore.yaml"
  - condition: "Scope unclear"
    action: "See scopes/infrastructure.yaml"
  - condition: "Need deployment footer"
    action: "See hooks/pre-push.md"
  - condition: "Quality check"
    action: "See guides/specificity.yaml"

# Subject line conventions
subject_conventions:
  - "Use imperative mood: 'Add feature' not 'Added feature'"
  - "Capitalize first letter"
  - "No period at end"
  - "Be specific: name constructs, not files"
  - "For quality check, see guides/specificity.yaml"

# Body conventions - include AWS details
body_conventions:
  - "Separate from subject with blank line"
  - "Explain what and why, not how"
  - "Include resource ARNs/names if relevant"
  - "Document config changes (CIDR, instance types)"
  - "Include migration steps if required"