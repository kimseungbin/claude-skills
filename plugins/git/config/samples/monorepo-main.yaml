# Monorepo Project Configuration
# For multi-package projects with complex structure
# Copy to: .claude/config/git/commit/main.yaml

plugin_version: "1.0.23"

project: your-project-name
description: "Monorepo with multiple packages"

# Format specification
format:
  pattern: "{type}({scope}): {subject}"
  max_subject_length: 72
  max_body_line_length: 100

# Quick reference - common types
# For detailed decision trees, see types/ directory
types_quick:
  feat: "New feature or capability"
  fix: "Bug fix"
  refactor: "Code change (neither bug fix nor feature)"
  perf: "Performance improvement"
  test: "Adding or updating tests"
  docs: "Documentation changes"
  style: "Code style changes (formatting)"
  build: "Build system or dependency changes"
  ci: "CI/CD configuration changes"
  chore: "Maintenance tasks"

# Monorepo scopes - update for your project
# For detailed patterns, see scopes/ directory
scopes_quick:
  frontend:
    description: "Frontend package"
    patterns:
      - "packages/frontend/**"
  backend:
    description: "Backend package"
    patterns:
      - "packages/backend/**"
  shared:
    description: "Shared libraries/types"
    patterns:
      - "packages/shared/**"
  monorepo:
    description: "Workspace root, affects multiple packages"
    patterns:
      - "package.json"
      - "tsconfig.base.json"
      - "packages/*/package.json"
  tools:
    description: "Developer tooling (CI, scripts, Docker)"
    default_type: "chore"
    patterns:
      - "scripts/**"
      - ".github/workflows/**"
      - "Dockerfile"
      - "docker-compose*.yml"
  config:
    description: "Configuration files"
    default_type: "chore"
    patterns:
      - ".eslintrc*"
      - ".prettierrc*"
      - "*.config.js"
  project:
    description: "Project documentation and Claude config"
    default_type: "docs"
    patterns:
      - "CLAUDE.md"
      - ".claude/**"
      - "README*.md"

# Which diffs are worth reading
#
# never_read:  glob patterns whose diffs carry no semantic value. The skill sees
#              them in the stat and commits them, but never loads their content.
# commit_with: derived file -> the source file it must ride along with. If the
#              derived file changed but its source did NOT, the skill surfaces it
#              instead of skipping.
#
# Patterns are unioned with any `-diff` / `linguist-generated=true` entries in
# .gitattributes.
#
# Only TRACKED files matter here. `git diff` never reports gitignored, untracked
# files, so build output you already gitignore costs nothing and needs no entry.
# These patterns earn their keep on files you are obliged to commit — lock files,
# snapshots, checked-in codegen.
#
# A pattern with no `/` matches at any depth; one with a `/` is anchored to the
# repo root. `**/` spans directories, a bare `*` does not.
diff_policy:
  never_read:
    - "**/*.lock"
    - "**/pnpm-lock.yaml"
    # Snapshots and checked-in codegen: must be committed, never worth reading.
    - "**/__snapshots__/**"
    - "**/generated/**"
    - "**/*.generated.*"
    # Only relevant if this monorepo commits build output. If dist/ and build/
    # are gitignored (the usual case), these two lines are harmless no-ops.
    - "**/dist/**"
    - "**/build/**"
  commit_with:
    "pnpm-lock.yaml": "package.json"
    "package-lock.json": "package.json"
    "yarn.lock": "package.json"

# Footer conventions
footer:
  required: []
  optional:
    - "BREAKING CHANGE: description"
    # "Closes #123" when the commit finishes the issue; "Refs #123" only when it does not.
    - "Closes #123 or Refs #123"
    - "Co-authored-by: Name <email>"

# Breaking-change detection (commit skill step 5e)
#
# The skill reads the group's diff and decides semantically whether the change
# breaks a consumer. `hints` describe what counts as breaking in THIS project so
# the skill knows where to look — they are attention hints, NOT regexes matched
# against the diff.
#
# In a monorepo the consumer is often a sibling package, and the same edit can be
# breaking or not depending on which side of a package boundary it lands on. An
# internal helper moving inside packages/shared/src/ breaks nobody; the same move
# in packages/shared/src/index.ts breaks every dependent package.
breaking_changes:
  detect: true

  # marker: both | footer | bang — see the samples README. "both" is the only
  # setting every conventional-commits version bumper recognizes.
  marker: both

  hints:
    - "A symbol left a package's public entry point (index.ts, package.json exports)"
    - "A type in packages/shared changed shape in a way dependents must adapt to"
    - "A workspace dependency range moved to a new major"
    - "An HTTP route, request field or response field changed in the backend package"
    - "A database migration drops or renames a column, or adds a non-nullable one"
    - "An environment variable became required, or its accepted values changed"

  # Paths with no consumer-facing surface. Detection skips a group entirely when
  # every one of its files matches here. Note that a package's internal src is
  # NOT exempt — only its tests are; a rename can still surface via exports.
  exempt_paths:
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/__tests__/**"
    - "**/__mocks__/**"
    - "**/fixtures/**"
    - "docs/**"

# Type Decision Tree
type_decision_tree:
  - question: "What are you doing?"
    answers:
      adding_new_capability: "feat"
      fixing_bug: "fix"
      changing_code_structure: "refactor"
      improving_performance: "perf"
      adding_tests: "test"
      updating_docs_only: "docs"
      formatting_code: "style"
      changing_build_deps: "build"
      updating_ci_cd: "ci"
      maintenance_tasks: "chore"

  - question: "Edge case unclear?"
    feat_vs_chore: "See types/chore.yaml"
    docs_vs_refactor: "See types/docs.yaml"
    refactor_vs_feat: "See types/refactor.yaml"

# Scope Decision
scope_decision:
  - question: "What files changed?"
    single_package: "Use package name (frontend, backend, shared)"
    multiple_packages: "Use monorepo"
    config_files: "Use config"
    ci_cd_files: "Use tools"
    documentation: "Use project"

  - question: "Still unclear?"
    patterns: "See scopes/*.yaml for detailed patterns"

# When to load detailed files
load_detailed_files:
  - condition: "Type still unclear after decision tree"
    action: "See types/*.yaml"
  - condition: "Scope unclear for multiple file changes"
    action: "See scopes/*.yaml"
  - condition: "Need similar commit example"
    action: "See examples/*.yaml"
  - condition: "Quality check needed"
    action: "See guides/specificity.yaml"

# Subject line conventions
subject_conventions:
  - "Use imperative mood: 'Add feature' not 'Added feature'"
  - "Capitalize first letter"
  - "No period at end"
  - "Be specific: name components, not just files"
  - "For quality check, see guides/specificity.yaml"

# Body conventions
body_conventions:
  - "Separate from subject with blank line"
  - "Explain what and why, not how"
  - "Use bullet points for multiple changes"
  - "Wrap at max_body_line_length"

# Multi-commit splitting guidance
splitting_guidance:
  when_to_split:
    - "Changes affect 2+ different packages"
    - "Mix of different types (feat + fix, feat + test)"
    - "Test-only changes separable from implementation"
    - "Config/tooling changes separable from features"
  when_not_to_split:
    - "Single feature with its tests"
    - "Related changes that should be atomic"
    - "Changes too small to meaningfully separate"