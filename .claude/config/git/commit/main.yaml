# Claude Skills Repository - Commit Configuration
# Copy to: .claude/config/git/commit/main.yaml

plugin_version: "1.0.28"

project: claude-skills
description: "Shared Claude Code skills and plugins repository"
language: en

# Format specification
format:
  pattern: "{type}({scope}): {subject}"
  max_subject_length: 72
  max_body_line_length: 100

# Quick reference - core types
types_quick:
  feat: "New feature or capability"
  fix: "Bug fix"
  refactor: "Code change (neither bug fix nor feature)"
  docs: "Documentation only"
  chore: "Maintenance, tooling, dependencies"

# Project scopes based on directory structure
scopes_quick:
  git: "Git workflow plugin (plugins/git/)"
  codebase-index: "Codebase index plugin (plugins/codebase-index/)"
  github-issue-writer: "Issue writer plugin (plugins/github-issue-writer/)"
  github-pr-management: "PR management plugin (plugins/github-pr-management/)"
  marketplace-feedback: "Marketplace feedback plugin (plugins/marketplace-feedback/)"
  aws-cli-access: "AWS IAM Identity Center access plugin (plugins/aws-cli-access/)"
  cdk-expert: "AWS CDK plugin (plugins/cdk-expert/)"
  korean-technical-translator: "Korean translation plugin (plugins/korean-technical-translator/)"
  tidy: "Obsidian note organization plugin (plugins/tidy/)"
  agent-team: "Agent team plugin (plugins/agent-team/)"
  lint-gate: "Lint quality gate plugin (plugins/lint-gate/)"
  polish-permissions: "Permission rule audit plugin (plugins/polish-permissions/)"
  plugins: "Changes spanning several plugins (plugins/)"
  marketplace: "Marketplace registry (.claude-plugin/marketplace.json)"
  issue-manager: "Open-issue review skill (.claude/skills/issue-manager/)"
  skill-creator: "Skill creator (.claude/skills/skill-creator/)"
  skills: "Shared skills (skills/)"
  commands: "Slash commands (commands/)"
  ci: "GitHub Actions workflows (.github/workflows/)"
  docs: "Documentation"

# Footer conventions
footer:
  required: []
  optional:
    - "BREAKING CHANGE: description"
    # "Closes #123" when the commit finishes the issue; "Refs #123" only when it does not.
    - "Closes #123 or Refs #123"

# Breaking-change detection (commit skill step 5e)
#
# Consumers install these plugins from the marketplace, so their public surface is
# the names they invoke, the config files they write, and the hooks they rely on.
# Hints are attention hints for semantic review of the diff, not regexes.
breaking_changes:
  detect: true
  marker: both
  hints:
    - "A plugin, skill, or slash command was removed or renamed"
    - "A key or path a plugin reads from .claude/config/ was removed, renamed, or became required"
    - "A hook's behavior changed so that existing project configs or workflows no longer work"
  # Local-only tooling, CI, tests and prose carry no consumer-facing surface.
  exempt_paths:
    - ".claude/**"
    - ".github/**"
    - "**/*.test.*"
    - "**/README.md"

# Type Decision Tree
type_decision_tree:
  - question: "What are you doing?"
    answers:
      adding_new_capability: "feat"
      fixing_bug: "fix"
      changing_code_structure: "refactor"
      updating_docs_only: "docs"
      updating_dependencies: "chore"

# Scope Decision
scope_decision:
  - question: "Which plugin or area changed?"
    git_plugin: "git"
    codebase_index_plugin: "codebase-index"
    issue_writer_plugin: "github-issue-writer"
    pr_management_plugin: "github-pr-management"
    feedback_plugin: "marketplace-feedback"
    aws_access_plugin: "aws-cli-access"
    cdk_plugin: "cdk-expert"
    translator_plugin: "korean-technical-translator"
    tidy_plugin: "tidy"
    agent_team_plugin: "agent-team"
    lint_gate_plugin: "lint-gate"
    permissions_plugin: "polish-permissions"
    multiple_plugins: "plugins"
    marketplace_registry: "marketplace"
    github_workflows: "ci"
    issue_manager: "issue-manager"
    skill_creator: "skill-creator"
    shared_skills: "skills"
    slash_commands: "commands"
    documentation: "docs"

# Subject line conventions
subject_conventions:
  - "Use imperative mood: 'Add feature' not 'Added feature'"
  - "Capitalize first letter"
  - "No period at end"
  - "Be specific"